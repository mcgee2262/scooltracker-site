<!doctype html><meta charset=utf-8><title>Doodle poses</title><meta name="robots" content="noindex"><body style="color:#CDC2FF;margin:0;background:#06100E;display:flex;flex-wrap:wrap;gap:10px;padding:10px">
<script src="doodle.js"></script>
<script>Doodle.poses.forEach(function(p){var d=document.createElement('div');d.style.cssText='width:220px;background:'+(p==='sleepy'?'#F4F8F6':'#0F211D')+';border-radius:20px';d.setAttribute('data-doodle',p);document.body.appendChild(d)});Doodle.mountAll();</script>
